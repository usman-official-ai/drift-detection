name: Data Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source type'
        required: false
        default: 'file'
        type: choice
        options:
          - file
          - api
      file_path:
        description: 'File path (if source is file)'
        required: false
        default: 'data/incoming/drift_sample.csv'

jobs:
  detect-drift:
    name: Run Drift Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Directories
        run: |
          mkdir -p data/reference data/incoming reports logs
          
      - name: Generate Test Data
        run: |
          python data_generator.py
          
      - name: Set Environment Variables
        run: |
          echo "ENABLE_EMAIL_ALERTS=false" >> .env
          echo "ENABLE_SLACK_ALERTS=false" >> .env
          echo "EMAIL_SENDER=dummy@example.com" >> .env
          echo "EMAIL_PASSWORD=dummy" >> .env
          echo "EMAIL_RECIPIENTS=[]" >> .env
          echo "SLACK_WEBHOOK_URL=" >> .env
          echo "PSI_THRESHOLD=0.2" >> .env
          echo "KS_THRESHOLD=0.05" >> .env
          echo "DRIFT_PERCENTAGE_THRESHOLD=0.3" >> .env
          echo "NUMERICAL_FEATURES=[\"age\",\"income\",\"transaction_amount\",\"credit_score\"]" >> .env
          echo "CATEGORICAL_FEATURES=[\"gender\",\"occupation\",\"location\",\"product_category\"]" >> .env
          echo "REFERENCE_DATA_PATH=data/reference/training_data.csv" >> .env
          echo "INCOMING_DATA_PATH=data/incoming/" >> .env
          echo "REPORTS_PATH=reports/" >> .env
          echo "LOGS_PATH=logs/app.log" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "TIMEZONE=UTC" >> .env
          
      - name: Run Drift Detection
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python -m src.main --mode once --source file
          
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
          
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `🚨 Drift detection failed on ${new Date().toISOString()}`;
            core.setFailed(message);
