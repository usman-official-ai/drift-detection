name: Data Drift Detection

on:
  schedule:
    # Run daily at 6:00 AM UTC (11:00 AM Pakistan Time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      source:
        description: 'Data source type'
        required: false
        default: 'file'
        type: choice
        options:
          - file
          - api
      file_path:
        description: 'File path (if source is file)'
        required: false
        default: 'data/incoming/drift_sample.csv'

jobs:
  detect-drift:
    name: Run Drift Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Directories
        run: |
          mkdir -p data/reference data/incoming reports logs
          
      - name: Generate Test Data
        run: |
          python data_generator.py
          
      - name: Set Environment Variables
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "EMAIL_SENDER=$EMAIL_SENDER" >> .env
          echo "EMAIL_PASSWORD=$EMAIL_PASSWORD" >> .env
          echo "EMAIL_RECIPIENTS=$EMAIL_RECIPIENTS" >> .env
          echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" >> .env
          
      - name: Run Drift Detection
        run: |
          if [ "${{ github.event.inputs.source }}" == "api" ]; then
            python src/main.py --mode once --source api --api-url http://api.example.com/data
          else
            python src/main.py --mode once --source file --file ${{ github.event.inputs.file_path || 'data/incoming/drift_sample.csv' }}
          fi
          
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: drift-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
          
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const message = `🚨 Drift detection failed on ${new Date().toISOString()}`;
            core.setFailed(message);